name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly vulnerability sweep (Mon 06:00 JST) so new advisories are
    # noticed even when no PRs are open.
    - cron: "0 21 * * 0"

permissions:
  contents: read

# Cancel superseded runs when a PR is force-pushed or updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          # Always resolve the newest patch release; a stale toolchain makes
          # govulncheck fail on stdlib vulns already fixed upstream.
          check-latest: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: true

      - name: Run tests with coverage
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.26'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  e2e:
    name: E2E (CDP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci --silent
        working-directory: e2e

      - name: Run E2E tests (Puppeteer / Playwright over CDP)
        run: make e2e

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run benchmarks
        run: go test ./internal/bench/ -bench=. -benchmem -count=5 > benchmark.txt

      - name: Generate Markdown report
        run: bash scripts/bench-report.sh benchmark.txt

      - name: Generate HTML report
        run: bash scripts/bench-visualize.sh benchmark.txt bench-report.html

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.sha }}
          path: |
            benchmark.txt
            bench-report.html
          retention-days: 90

  benchmark-pr:
    name: Benchmark (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    needs: quality
    permissions:
      contents: read
      pull-requests: write
    env:
      # golang.org/x/perf has no semver tags; pin the latest pseudo-version.
      BENCHSTAT_VERSION: v0.0.0-20260709024250-82a0b07e230d
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the merge-base with the target branch is reachable.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run benchmarks (base)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git checkout "$(git merge-base "origin/$BASE_REF" HEAD)"
          go test ./internal/bench/ -bench=. -benchmem -count=5 > base.txt

      - name: Run benchmarks (head)
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git checkout "$HEAD_SHA"
          go test ./internal/bench/ -bench=. -benchmem -count=5 > head.txt

      - name: Compare with benchstat
        id: bench
        run: |
          {
            echo 'report<<BENCHSTAT_EOF'
            go run "golang.org/x/perf/cmd/benchstat@$BENCHSTAT_VERSION" base.txt head.txt 2>&1
            echo 'BENCHSTAT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: benchmark
          message: |
            ## Benchmark Diff (base vs PR)

            ```
            ${{ steps.bench.outputs.report }}
            ```

            <sub>How to read: negative % = faster/less memory in this PR. `~` means no statistically significant difference; `geomean` is the geometric mean across all benchmarks. Commit: ${{ github.sha }}</sub>
